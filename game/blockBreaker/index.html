<!doctype html>
<!--mdn ブロック崩し STEP2 各フレームの前にキャンバスを消去まで-->
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ブロック崩しゲーム</title>
  <link rel="stylesheet" href="./css/blockBreaker.css">
</head>

<body>
  <canvas id="myCanvas" width="480" height="320"></canvas>
  <script type="module">
    const CANVAS = document.getElementById("myCanvas");
    const CTX = CANVAS.getContext("2d");
    import { Ball, BALL_RADIUS } from './object/ball.js';
    const BALL = new Ball(CANVAS);
    import { Paddle } from './object/paddle.js';
    const PADDLE = new Paddle(CANVAS);
    import { Bricks } from './object/bricks.js';
    const BRICKS = new Bricks(CANVAS);
    import { Lives } from './object/lives.js';
    const LIVES = new Lives(CANVAS);
    import { Score } from './object/score.js';
    const SCORE = new Score(CANVAS);
    import { GameState, STATE_TYPE } from './object/gameState.js';
    const GAME_STATE = new GameState();

    /*
    *オブジェクトの状態を初期状態に戻す
    */
    function resetObject() {
      SCORE.reset();
      LIVES.reset();
      BALL.setRestartPosition(CANVAS);
      PADDLE.reset();
      BRICKS.resetHp();
    }

    /*
    *ブロックの衝突判定
    *[c][r]それぞれののfor文によりブロックを特定
    *ボールの判定xyが重なった場合に衝突とする
    */
    function collisionDetection() {
      for (var c = 0; c < BRICKS.brickColumnCount; c++) {
        for (var r = 0; r < BRICKS.brickRowCount; r++) {
          var b = BRICKS.bricks[c][r];
          //衝突した場合の処理
          let isCollision = BALL.x > b.x &&
            BALL.x < b.x + BRICKS.brickWidth &&
            BALL.y > b.y &&
            BALL.y < b.y + BRICKS.brickHeight;
          if (b.status == BRICKS.brickStartHp) {
            if (isCollision) {
              BALL.dy = -BALL.dy;
              b.status = BRICKS.brickDestroyHp;
              BALL.changeBallColor();
              BALL.changeSpeedForReflection();
              SCORE.increase();
              if (SCORE.isGameClear(BRICKS)) {
                GAME_STATE.setGameClear();
              }
            }
          }
        }
      }
    }

    //タイトル画面の描画
    function drawTitleScreen() {
      CTX.fillStyle = "red";
      CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

      CTX.font = "bold 24px Arial";
      CTX.fillStyle = "white";
      CTX.textAlign = "center";
      CTX.fillText("BLOCK BREAKER", CANVAS.width / 2, CANVAS.height / 2 - 20);

      CTX.font = "16px Arial";
      CTX.fillStyle = "white";
      CTX.fillText("クリックorタッチでスタート", CANVAS.width / 2, CANVAS.height / 2 + 30);
    }

    //ゲームオーバー画面の描画
    function drawGameOverScreen() {
      CTX.fillStyle = "rgba(0, 0, 0, 0.6)";
      CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

      CTX.font = "bold 32px Arial";
      CTX.fillStyle = "#FF0000";
      CTX.textAlign = "center";
      CTX.fillText("GAME OVER", CANVAS.width / 2, CANVAS.height / 2 - 10);

      CTX.font = "16px Arial";
      CTX.fillStyle = "#FFF";
      CTX.fillText("クリックorタッチでタイトルへ戻る", CANVAS.width / 2, CANVAS.height / 2 + 40);
    }

    //クリア画面の描画
    function drawClearScreen() {
      CTX.fillStyle = "rgba(0, 0, 0, 0.6)";
      CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

      CTX.font = "bold 32px Arial";
      CTX.fillStyle = "#FFD700";
      CTX.textAlign = "center";
      CTX.fillText("GAME CLEAR!", CANVAS.width / 2, CANVAS.height / 2 - 10);

      CTX.font = "16px Arial";
      CTX.fillStyle = "#FFF";
      CTX.fillText("クリックorタッチでタイトルへ戻る", CANVAS.width / 2, CANVAS.height / 2 + 40);
    }

    //ゲームの状態に合わせた処理を実行する
    function draw() {
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
      switch (GAME_STATE.state) {
        case STATE_TYPE.TITLE:
          drawTitleScreen();
          break;

        case STATE_TYPE.RUN:
          runGame();
          break;

        case STATE_TYPE.GAME_OVER:
          drawGameObjects();
          drawGameOverScreen();
          break;

        case STATE_TYPE.GAME_CLEAR:
          drawGameObjects();
          drawClearScreen();
          break;
      }

      // requestAnimationFrame()により繰り返される
      requestAnimationFrame(draw);
    }

    // 各オブジェクトを描画する
    function drawGameObjects() {
      BRICKS.drawBricks(CTX);
      BALL.draw(CTX);
      PADDLE.drawPaddle(CTX);
      LIVES.drawLives(CTX);
      SCORE.drawScore(CTX);
    }

    // ゲームプレイ中の処理
    function runGame() {
      drawGameObjects();

      collisionDetection();
      BALL.x += BALL.dx;
      BALL.y += BALL.dy;
      BALL.reflectionForCanvasSide();

      //最下部にボールが落ちた場合の処理
      const PADDLE_Y = CANVAS.height - BALL_RADIUS - PADDLE.Height;
      const MARGIN_FOR_MISS = 5;
      if (BALL.isCanvasTop()) {
        BALL.dy = -BALL.dy;
        BALL.changeBallColor();
      }
      else if (BALL.y + BALL.dy > PADDLE_Y) {
        if (BALL.x > PADDLE.paddleX && BALL.x < PADDLE.paddleX + PADDLE.Width) {
          BALL.y = PADDLE_Y;
          BALL.dy = -BALL.dy;
          BALL.changeSpeedForReflection();
          BALL.changeBallColor();
        }
        else if (BALL.y + BALL.dy > CANVAS.height - BALL_RADIUS + MARGIN_FOR_MISS) {
          LIVES.lose();
          if (LIVES.isGameOver()) {
            GAME_STATE.setGameOver();
          } else {
            BALL.setRestartPosition(CANVAS);
            PADDLE.paddleX = (CANVAS.width - PADDLE.Width) / 2;
          }
        }
      }

      PADDLE.move();
    }

    /*
    *以下の状態でクリックされた場合の処理
    *・スタート画面
    *・ゲームオーバー画面
    *・クリア画面
    */
    CANVAS.addEventListener("click", () => {
      if (GAME_STATE.isTitle()) {
        resetObject();
        GAME_STATE.setRun();
      }
      else if (GAME_STATE.isGameOver() || GAME_STATE.isGameClear()) {
        GAME_STATE.setTitle();
      }
    });

    /*キーボード入力*/
    document.addEventListener("keydown", (e) => {
      if (GAME_STATE.isRunning()) {
        PADDLE.keyDownHandler(e);
      }
    }, false);

    /*キーボード未入力*/
    document.addEventListener("keyup", (e) => {
      if (GAME_STATE.isRunning()) {
        PADDLE.keyUpHandler(e);
      }
    }, false);

    /**
     * マウス入力
     * TODO　スマホ実装に伴って削除するかも？
    */
    document.addEventListener("mousemove", (e) => {
      if (GAME_STATE.isRunning()) {
        PADDLE.mouseMoveHandler(e);
      }
    }, false);

    draw();
  </script>
</body>

</html>
