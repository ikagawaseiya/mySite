<!doctype html>
<!--mdn ブロック崩し STEP2 各フレームの前にキャンバスを消去まで-->
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ブロック崩しゲーム</title>
  <link rel="stylesheet" href="./css/blockBreaker.css">
</head>

<body>
  <canvas id="myCanvas" width="480" height="320"></canvas>
  <script type="module">
    import { Ball, BALL_RADIUS } from './object/ball.js';
    const CANVAS = document.getElementById("myCanvas");
    const CTX = CANVAS.getContext("2d");
    const BALL = new Ball(CANVAS);
    //パドルの描画設定
    const paddleHeight = 10;
    const paddleWidth = 75;
    let paddleX = (CANVAS.width - paddleWidth) / 2;
    //パドルの操作設定
    let rightPressed = false;
    let leftPressed = false;
    //ブロックの描画設定
    const brickRowCount = 4;
    const brickColumnCount = 5;
    const brickWidth = 75;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 30;
    //スコアの描画設定
    let score = 0;
    //ライフ
    let lives = 3;

    const brickExistsStatus = 1;
    const brickDestroyStatus = 0;
    const bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
      bricks[c] = [];
      for (let r = 0; r < brickRowCount; r++) {
        //値x,y,破壊の判定statusのプロパティ
        bricks[c][r] = { x: 0, y: 0, status: brickExistsStatus };
      }
    }


    /*
    *ブロックを並べて配置する
    *statusが1ではない(破壊された)ものは表示しない
    */
    function drawBricks() {
      for (var c = 0; c < brickColumnCount; c++) {
        for (var r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status == brickExistsStatus) {
            var brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
            var brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            CTX.beginPath();
            CTX.rect(brickX, brickY, brickWidth, brickHeight);
            CTX.fillStyle = "#0095DD";
            CTX.fill();
            CTX.closePath();
          }
        }
      }
    }

    //パドルの描画
    function drawPaddle() {
      CTX.beginPath();
      CTX.rect(paddleX, CANVAS.height - paddleHeight, paddleWidth, paddleHeight);
      CTX.fillStyle = "#0095DD";
      CTX.fill();
      CTX.closePath();
    }

    //ライフの描画
    function drawLives() {
      CTX.font = "16px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.fillText(`Lives: ${lives}`, CANVAS.width - 65, 20);
    }

    /*
    *ブロックの衝突判定
    *[c][r]それぞれののfor文によりブロックを特定
    *ボールの判定xyが重なった場合に衝突とする
    */
    function collisionDetection() {
      for (var c = 0; c < brickColumnCount; c++) {
        for (var r = 0; r < brickRowCount; r++) {
          var b = bricks[c][r];
          //衝突した場合の処理
          let isCollision = BALL.x > b.x &&
            BALL.x < b.x + brickWidth &&
            BALL.y > b.y &&
            BALL.y < b.y + brickHeight;
          if (b.status == brickExistsStatus) {
            if (isCollision) {
              BALL.dy = -BALL.dy;
              b.status = brickDestroyStatus;
              BALL.changeBallColorRandom()
              score++;
              if (score === brickRowCount * brickColumnCount) {
                alert("YOU WIN, CONGRATULATIONS!");
                document.location.reload();
              }
            }
          }
        }
      }
    }

    //スコアの描画
    function drawScore() {
      CTX.font = "16px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.fillText(`Score: ${score}`, 8, 20);
    }

    //全体の動きを管理する
    function draw() {
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
      drawBricks();
      BALL.draw(CTX);
      drawPaddle();
      drawScore();
      drawLives();
      collisionDetection();
      BALL.x += BALL.dx;
      BALL.y += BALL.dy;

      if (BALL.x + BALL.dx > CANVAS.width - BALL_RADIUS || BALL.x + BALL.dx < BALL_RADIUS) {
        BALL.dx = -BALL.dx; BALL.changeBallColorRandom();
      }

      /*パドルの高さの当たり判定*/
      const paddleY = CANVAS.height - BALL_RADIUS - paddleHeight;
      if (BALL.y + BALL.dy < BALL_RADIUS) {
        BALL.dy = -BALL.dy; BALL.changeBallColorRandom();
      }
      else if (BALL.y + BALL.dy > paddleY) {
        // 横方向がパドルの幅の中に収まっているか
        if (BALL.x > paddleX && BALL.x < paddleX + paddleWidth) {
          BALL.y = paddleY;
          BALL.dy = -BALL.dy;
          BALL.changeSpeedForPaddleReflection();
          BALL.changeBallColorRandom();
        }
        else if (BALL.y + BALL.dy > CANVAS.height - BALL_RADIUS + 5) {
          lives--;
          if (!lives) {
            alert("GAME OVER");
            document.location.reload();
          } else {
            BALL.drawRestartPosition(CANVAS);
            paddleX = (CANVAS.width - paddleWidth) / 2;
          }
        }
      }

      //パドルの移動設定
      if (rightPressed) {
        paddleX = Math.min(paddleX + 7, CANVAS.width - paddleWidth);
      } else if (leftPressed) {
        paddleX = Math.max(paddleX - 7, 0);
      }

      //requestAnimationFrame()により繰り返される
      //描画はブラウザで制御される
      requestAnimationFrame(draw);
    }

    document.addEventListener("keydown", keyDownHandler, false);
    document.addEventListener("keyup", keyUpHandler, false);
    document.addEventListener("mousemove", mouseMoveHandler, false);

    /*
    *キーボード入力を検知する
    *作動処理
    */
    function keyDownHandler(e) {
      if (e.key === "Right" || e.key === "ArrowRight") {
        rightPressed = true;
      } else if (e.key === "Left" || e.key === "ArrowLeft") {
        leftPressed = true;
      }
    }

    /*
    *キーボード入力を検知する
    *停止処理
    */
    function keyUpHandler(e) {
      if (e.key === "Right" || e.key === "ArrowRight") {
        rightPressed = false;
      } else if (e.key === "Left" || e.key === "ArrowLeft") {
        leftPressed = false;
      }
    }

    /*
    *マウス入力を検知する
     * 
    */
    function mouseMoveHandler(e) {
      const relativeX = e.clientX - CANVAS.offsetLeft;
      if (relativeX > 0 && relativeX < CANVAS.width) {
        paddleX = relativeX - paddleWidth / 2;
      }
    }

    draw();
  </script>
</body>

</html>
