<!doctype html>
<!--mdn ブロック崩し STEP2 各フレームの前にキャンバスを消去まで-->
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ブロック崩しゲーム</title>
  <link rel="stylesheet" href="./css/blockBreaker.css">
</head>

<body>
  <canvas id="myCanvas" width="480" height="320"></canvas>
  <script type="module">
    const CANVAS = document.getElementById("myCanvas");
    const CTX = CANVAS.getContext("2d");
    import { Ball, BALL_RADIUS } from './object/ball.js';
    const BALL = new Ball(CANVAS);
    import { Paddle } from './object/paddle.js';
    const PADDLE = new Paddle(CANVAS);

    //パドルの描画設定
    //TODO オブジェクトの切り分け完了後に消す
    const paddleHeight = 10;
    const paddleWidth = 75;

    //ブロックの描画設定
    const brickRowCount = 4;
    const brickColumnCount = 5;
    const brickWidth = 75;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 30;
    //スコアの描画設定
    let score = 0;
    //プレイヤーのライフ
    let lives = 3;

    const brickHp = 1;
    const brickDestroyHp = 0;
    const bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
      bricks[c] = [];
      for (let r = 0; r < brickRowCount; r++) {
        //値x,y,破壊の判定statusのプロパティ
        bricks[c][r] = { x: 0, y: 0, status: brickHp };
      }
    }


    /*
    *ブロックを並べて配置する
    *statusが1ではない(破壊された)ものは表示しない
    */
    function drawBricks() {
      for (var c = 0; c < brickColumnCount; c++) {
        for (var r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status == brickHp) {
            var brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
            var brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            CTX.beginPath();
            CTX.rect(brickX, brickY, brickWidth, brickHeight);
            CTX.fillStyle = "yellow";
            CTX.fill();
            CTX.closePath();
          }
        }
      }
    }

    //ライフの描画
    function drawLives() {
      CTX.font = "16px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.fillText(`Lives: ${lives}`, CANVAS.width - 65, 20);
    }

    /*
    *ブロックの衝突判定
    *[c][r]それぞれののfor文によりブロックを特定
    *ボールの判定xyが重なった場合に衝突とする
    */
    function collisionDetection() {
      for (var c = 0; c < brickColumnCount; c++) {
        for (var r = 0; r < brickRowCount; r++) {
          var b = bricks[c][r];
          //衝突した場合の処理
          let isCollision = BALL.x > b.x &&
            BALL.x < b.x + brickWidth &&
            BALL.y > b.y &&
            BALL.y < b.y + brickHeight;
          if (b.status == brickHp) {
            if (isCollision) {
              BALL.dy = -BALL.dy;
              b.status = brickDestroyHp;
              BALL.changeBallColor()
              score++;
              if (score === brickRowCount * brickColumnCount) {
                alert("YOU WIN, CONGRATULATIONS!");
                document.location.reload();
              }
            }
          }
        }
      }
    }

    //スコアの描画
    function drawScore() {
      CTX.font = "16px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.fillText(`Score: ${score}`, 8, 20);
    }

    //全体の動きを管理する
    function draw() {
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
      drawBricks();
      BALL.draw(CTX);
      PADDLE.drawPaddle(CTX);
      drawScore();
      drawLives();
      collisionDetection();
      BALL.x += BALL.dx;
      BALL.y += BALL.dy;

      BALL.reflectionForCanvasSide();

      //縦方向のボールが当たった場合の処理
      //後にボールクラスへ移動するかも？
      /*パドルの高さの当たり判定*/
      const paddleY = CANVAS.height - BALL_RADIUS - paddleHeight;
      if (BALL.y + BALL.dy < BALL_RADIUS) {
        BALL.dy = -BALL.dy; BALL.changeBallColor();
      }
      else if (BALL.y + BALL.dy > paddleY) {
        // 横方向がパドルの幅の中に収まっているか
        if (BALL.x > PADDLE.paddleX && BALL.x < PADDLE.paddleX + paddleWidth) {
          BALL.y = paddleY;
          BALL.dy = -BALL.dy;
          BALL.changeSpeedForPaddleReflection();
          BALL.changeBallColor();
        }
        else if (BALL.y + BALL.dy > CANVAS.height - BALL_RADIUS + 5) {
          lives--;
          if (!lives) {
            alert("GAME OVER");
            document.location.reload();
          } else {
            BALL.drawRestartPosition(CANVAS);
            PADDLE.paddleX = (CANVAS.width - paddleWidth) / 2;
          }
        }
      }

      PADDLE.move();

      //requestAnimationFrame()により繰り返される
      //描画はブラウザで制御される
      requestAnimationFrame(draw);
    }

    document.addEventListener("keydown", (e) => PADDLE.keyDownHandler(e), false);
    document.addEventListener("keyup", (e) => PADDLE.keyUpHandler(e), false);
    document.addEventListener("mousemove", (e) => PADDLE.mouseMoveHandler(e), false);

    draw();
  </script>
</body>

</html>
