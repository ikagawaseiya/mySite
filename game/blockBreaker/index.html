<!doctype html>
<!--mdn ブロック崩し STEP2 各フレームの前にキャンバスを消去まで-->
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ブロック崩しゲーム</title>
  <link rel="stylesheet" href="./css/blockBreaker.css">
</head>

<body>
  <canvas id="myCanvas" width="480" height="320"></canvas>
  <script type="module">
    const CANVAS = document.getElementById("myCanvas");
    const CTX = CANVAS.getContext("2d");
    import { Ball, BALL_RADIUS } from './object/ball.js';
    const BALL = new Ball(CANVAS);
    import { Paddle } from './object/paddle.js';
    const PADDLE = new Paddle(CANVAS);
    import { Bricks } from './object/bricks.js';
    const BRICKS = new Bricks(CANVAS);


    //スコアの描画設定
    let score = 0;
    //プレイヤーのライフ
    let lives = 3;



    //ライフの描画
    function drawLives() {
      CTX.font = "16px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.fillText(`Lives: ${lives}`, CANVAS.width - 65, 20);
    }

    /*
    *ブロックの衝突判定
    *[c][r]それぞれののfor文によりブロックを特定
    *ボールの判定xyが重なった場合に衝突とする
    *TODO BRICKSクラスへ移動するかも？ 
    */
    function collisionDetection() {
      for (var c = 0; c < BRICKS.brickColumnCount; c++) {
        for (var r = 0; r < BRICKS.brickRowCount; r++) {
          var b = BRICKS.bricks[c][r];
          //衝突した場合の処理
          let isCollision = BALL.x > b.x &&
            BALL.x < b.x + BRICKS.brickWidth &&
            BALL.y > b.y &&
            BALL.y < b.y + BRICKS.brickHeight;
          if (b.status == BRICKS.brickHp) {
            if (isCollision) {
              BALL.dy = -BALL.dy;
              b.status = BRICKS.brickDestroyHp;
              BALL.changeBallColor()
              score++;
              if (score === BRICKS.brickRowCount * BRICKS.brickColumnCount) {
                alert("YOU WIN, CONGRATULATIONS!");
                document.location.reload();
              }
            }
          }
        }
      }
    }

    //スコアの描画
    function drawScore() {
      CTX.font = "16px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.fillText(`Score: ${score}`, 8, 20);
    }

    //全体の動きを管理する
    function draw() {
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
      BRICKS.drawBricks(CTX);
      BALL.draw(CTX);
      PADDLE.drawPaddle(CTX);
      drawScore();
      drawLives();
      collisionDetection();
      BALL.x += BALL.dx;
      BALL.y += BALL.dy;

      BALL.reflectionForCanvasSide();

      //縦方向のボールが当たった場合の処理
      //後にボールクラスへ移動するかも？
      /*パドルの高さの当たり判定*/
      const paddleY = CANVAS.height - BALL_RADIUS - PADDLE.Height;
      if (BALL.isCanvasTop()) {
        BALL.dy = -BALL.dy; BALL.changeBallColor();
      }
      else if (BALL.y + BALL.dy > paddleY) {
        // 横方向がパドルの幅の中に収まっているか
        if (BALL.x > PADDLE.paddleX && BALL.x < PADDLE.paddleX + PADDLE.Width) {
          BALL.y = paddleY;
          BALL.dy = -BALL.dy;
          BALL.changeSpeedForPaddleReflection();
          BALL.changeBallColor();
        }
        else if (BALL.y + BALL.dy > CANVAS.height - BALL_RADIUS + 5) {
          lives--;
          if (!lives) {
            alert("GAME OVER");
            document.location.reload();
          } else {
            BALL.drawRestartPosition(CANVAS);
            PADDLE.paddleX = (CANVAS.width - PADDLE.Width) / 2;
          }
        }
      }

      PADDLE.move();

      //requestAnimationFrame()により繰り返される
      //描画はブラウザで制御される
      requestAnimationFrame(draw);
    }

    document.addEventListener("keydown", (e) => PADDLE.keyDownHandler(e), false);
    document.addEventListener("keyup", (e) => PADDLE.keyUpHandler(e), false);
    document.addEventListener("mousemove", (e) => PADDLE.mouseMoveHandler(e), false);

    draw();
  </script>
</body>

</html>
