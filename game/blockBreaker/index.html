<!doctype html>
<!--mdn ブロック崩し STEP2 各フレームの前にキャンバスを消去まで-->
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ブロック崩しゲーム</title>
  <link rel="stylesheet" href="./css/blockBreaker.css">
</head>

<body>
  <canvas id="myCanvas" width="480" height="320"></canvas>
  <script type="module">
    const CANVAS = document.getElementById("myCanvas");
    const CTX = CANVAS.getContext("2d");
    import { TITLE_SCREEN } from './screen/title.js';
    import { GAME_OVER_SCREEN } from './screen/gameOver.js';
    import { GAME_CLEAR_SCREEN } from './screen/gameClear.js';
    import { Sound } from './sound/sound.js';
    const SOUND = new Sound();
    import { GameState, STATE_TYPE } from './object/gameState.js';
    const GAME_STATE = new GameState();

    import { Ball, BALL_RADIUS } from './object/ball.js';
    const BALL = new Ball(CANVAS);
    import { Paddle } from './object/paddle.js';
    const PADDLE = new Paddle(CANVAS);
    import { Bricks } from './object/bricks.js';
    const BRICKS = new Bricks(CANVAS);
    import { Lives } from './object/lives.js';
    const LIVES = new Lives(CANVAS);
    import { Score } from './object/score.js';
    const SCORE = new Score(CANVAS);
    import { Timer } from './object/timer.js';
    const TIMER = new Timer(CANVAS);


    // 各オブジェクトを描画する
    function drawGameObjects() {
      BRICKS.drawBricks(CTX);
      BALL.draw(CTX);
      PADDLE.drawPaddle(CTX);
      LIVES.drawLives(CTX);
      SCORE.drawScore(CTX);
      TIMER.draw(CTX);
    }

    /*
    *各オブジェクトの状態を初期状態に戻す
    */
    function resetObject() {
      SCORE.reset();
      LIVES.reset();
      BALL.reset();
      PADDLE.reset();
      BRICKS.reset();
      TIMER.reset();
    }

    /**
     *状態による画面を描画する
     *
     * 以下の画面が存在する
     * ・タイトル画面
     * ・ゲーム画面
     * ・ゲームオーバー画面
     * ・ゲームクリア画面
     */
    function draw() {
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
      switch (GAME_STATE.state) {
        case STATE_TYPE.TITLE:
          TITLE_SCREEN.draw(CTX, CANVAS);
          break;

        case STATE_TYPE.RUN:
          runGame();
          break;

        case STATE_TYPE.GAME_OVER:
          TIMER.stop();
          drawGameObjects();
          GAME_OVER_SCREEN.draw(CTX, CANVAS);
          break;

        case STATE_TYPE.GAME_CLEAR:
          TIMER.stop();
          drawGameObjects();
          GAME_CLEAR_SCREEN.draw(CTX, CANVAS);
          break;
      }

      // requestAnimationFrame()により繰り返される
      requestAnimationFrame(draw);
    }


    // ゲーム実行
    function runGame() {
      drawGameObjects();

      TIMER.run();
      BALL.move();
      BALL.checkReflectionForCanvasSide();
      BALL.checkReflectionForCanvasTop();
      BALL.checkReflectionForCanvasBottom(PADDLE, LIVES, GAME_STATE);

      BALL.checkBricksCollision(BRICKS, SCORE, GAME_STATE, SOUND);

      PADDLE.move();
    }

    /*
    *以下の状態毎の、クリックされた場合の処理
    *
    *1.タイトル
    *ゲームを起動する
    *
    *2.ゲームオーバーまたはクリア
    *状態をタイトルとする
    */
    CANVAS.addEventListener("click", () => {
      if (GAME_STATE.isTitle()) {
        resetObject();
        GAME_STATE.setRun();
      }
      else if (GAME_STATE.isGameOver() || GAME_STATE.isGameClear()) {
        GAME_STATE.setTitle();
      }
    });

    /*キーボード入力*/
    document.addEventListener("keydown", (e) => {
      if (GAME_STATE.isRunning()) {
        PADDLE.keyDownHandler(e);
      }
    }, false);

    /*キーボード未入力*/
    document.addEventListener("keyup", (e) => {
      if (GAME_STATE.isRunning()) {
        PADDLE.keyUpHandler(e);
      }
    }, false);

    /**
     * マウス入力
     * TODO　スマホ実装に伴って削除するかも？
    */
    document.addEventListener("mousemove", (e) => {
      if (GAME_STATE.isRunning()) {
        PADDLE.mouseMoveHandler(e);
      }
    }, false);

    draw();
  </script>
</body>

</html>
