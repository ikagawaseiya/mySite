<!doctype html>
<!--mdn ブロック崩し STEP2 各フレームの前にキャンバスを消去まで-->
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ブロック崩しゲーム</title>
  <link rel="stylesheet" href="./css/blockBreaker.css">
</head>

<body>
  <canvas id="myCanvas" width="480" height="320"></canvas>
  <script type="module">
    const CANVAS = document.getElementById("myCanvas");
    const CTX = CANVAS.getContext("2d");
    import { Ball, BALL_RADIUS } from './object/ball.js';
    const BALL = new Ball(CANVAS);
    import { Paddle } from './object/paddle.js';
    const PADDLE = new Paddle(CANVAS);
    import { Bricks } from './object/bricks.js';
    const BRICKS = new Bricks(CANVAS);

    //TODO 後々クラスで分ける
    const STATE_START = 'start';
    const STATE_PLAYING = 'playing';
    const STATE_GAMEOVER = 'gameover';
    const STATE_CLEAR = 'clear';
    let gameState = STATE_START;

    //スコアの描画設定
    let score = 0;
    //プレイヤーのライフ
    let lives = 3;

    /*
    *オブジェクトの状態を初期状態に戻す
    *TODO　※後々各オブジェクト側のjsへ移す
    */
    function resetGame() {
      score = 0;
      lives = 3;
      BALL.drawRestartPosition(CANVAS);
      PADDLE.paddleX = (CANVAS.width - PADDLE.Width) / 2;
      for (let c = 0; c < BRICKS.brickColumnCount; c++) {
        for (let r = 0; r < BRICKS.brickRowCount; r++) {
          BRICKS.bricks[c][r].status = BRICKS.brickHp;
        }
      }
    }

    //ライフの描画
    function drawLives() {
      CTX.font = "16px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.fillText(`Lives: ${lives}`, CANVAS.width - 65, 20);
    }

    /*
    *ブロックの衝突判定
    *[c][r]それぞれののfor文によりブロックを特定
    *ボールの判定xyが重なった場合に衝突とする
    *TODO BRICKSクラスへ移動するかも？ 
    */
    function collisionDetection() {
      for (var c = 0; c < BRICKS.brickColumnCount; c++) {
        for (var r = 0; r < BRICKS.brickRowCount; r++) {
          var b = BRICKS.bricks[c][r];
          //衝突した場合の処理
          let isCollision = BALL.x > b.x &&
            BALL.x < b.x + BRICKS.brickWidth &&
            BALL.y > b.y &&
            BALL.y < b.y + BRICKS.brickHeight;
          if (b.status == BRICKS.brickHp) {
            if (isCollision) {
              BALL.dy = -BALL.dy;
              b.status = BRICKS.brickDestroyHp;
              BALL.changeBallColor()
              score++;
              if (score === BRICKS.brickRowCount * BRICKS.brickColumnCount) {
                gameState = STATE_CLEAR;
              }
            }
          }
        }
      }
    }

    //スコアの描画
    function drawScore() {
      CTX.font = "16px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.fillText(`Score: ${score}`, 8, 20);
    }

    //スタート画面の描画
    function drawStartScreen() {
      CTX.fillStyle = "#f0f0f0";
      CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

      CTX.font = "bold 24px Arial";
      CTX.fillStyle = "#0095DD";
      CTX.textAlign = "center";
      CTX.fillText("ブロック崩しゲーム", CANVAS.width / 2, CANVAS.height / 2 - 20);

      CTX.font = "16px Arial";
      CTX.fillStyle = "#555";
      CTX.fillText("クリックorタッチでスタート", CANVAS.width / 2, CANVAS.height / 2 + 30);
    }

    //ゲームオーバー画面の描画
    function drawGameOverScreen() {
      CTX.fillStyle = "rgba(0, 0, 0, 0.6)";
      CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

      CTX.font = "bold 32px Arial";
      CTX.fillStyle = "#FF0000";
      CTX.textAlign = "center";
      CTX.fillText("GAME OVER", CANVAS.width / 2, CANVAS.height / 2 - 10);

      CTX.font = "16px Arial";
      CTX.fillStyle = "#FFF";
      CTX.fillText("クリックorタッチでタイトルへ戻る", CANVAS.width / 2, CANVAS.height / 2 + 40);
    }

    //クリア画面の描画
    function drawClearScreen() {
      CTX.fillStyle = "rgba(0, 0, 0, 0.6)";
      CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

      CTX.font = "bold 32px Arial";
      CTX.fillStyle = "#FFD700";
      CTX.textAlign = "center";
      CTX.fillText("GAME CREAR!", CANVAS.width / 2, CANVAS.height / 2 - 10);

      CTX.font = "16px Arial";
      CTX.fillStyle = "#FFF";
      CTX.fillText("クリックorタッチでタイトルへ戻る", CANVAS.width / 2, CANVAS.height / 2 + 40);
    }

    //ゲームの状態に合わせた処理を実行する
    function draw() {
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
      switch (gameState) {
        case STATE_START:
          drawStartScreen();
          break;

        case STATE_PLAYING:
          runGame();
          break;

        case STATE_GAMEOVER:
          drawGameObjects();
          drawGameOverScreen();
          break;

        case STATE_CLEAR:
          drawGameObjects();
          drawClearScreen();
          break;
      }

      // requestAnimationFrame()により繰り返される
      requestAnimationFrame(draw);
    }

    // 各オブジェクトの描画
    function drawGameObjects() {
      BRICKS.drawBricks(CTX);
      BALL.draw(CTX);
      PADDLE.drawPaddle(CTX);
      drawScore();
      drawLives();
    }

    // ゲームプレイ中の処理
    function runGame() {
      drawGameObjects();

      collisionDetection();
      BALL.x += BALL.dx;
      BALL.y += BALL.dy;
      BALL.reflectionForCanvasSide();

      //最下部にボールが落ちた場合の処理
      const paddleY = CANVAS.height - BALL_RADIUS - PADDLE.Height;
      if (BALL.isCanvasTop()) {
        BALL.dy = -BALL.dy;
        BALL.changeBallColor();
      }
      else if (BALL.y + BALL.dy > paddleY) {
        if (BALL.x > PADDLE.paddleX && BALL.x < PADDLE.paddleX + PADDLE.Width) {
          BALL.y = paddleY;
          BALL.dy = -BALL.dy;
          BALL.changeSpeedForPaddleReflection();
          BALL.changeBallColor();
        }
        else if (BALL.y + BALL.dy > CANVAS.height - BALL_RADIUS + 5) {
          lives--;
          if (!lives) {
            gameState = STATE_GAMEOVER;
          } else {
            BALL.drawRestartPosition(CANVAS);
            PADDLE.paddleX = (CANVAS.width - PADDLE.Width) / 2;
          }
        }
      }

      PADDLE.move();
    }

    /*
    *以下の状態でクリックされた場合の処理
    *・スタート画面
    *・ゲームオーバー画面
    *・クリア画面
    */
    CANVAS.addEventListener("click", () => {
      if (gameState === STATE_START) {
        resetGame();
        gameState = STATE_PLAYING;
      }
      else if (gameState === STATE_GAMEOVER || gameState === STATE_CLEAR) {
        gameState = STATE_START;
      }
    });


    document.addEventListener("keydown", (e) => {
      if (gameState === STATE_PLAYING) {
        PADDLE.keyDownHandler(e);
      }
    }, false);

    document.addEventListener("keyup", (e) => {
      if (gameState === STATE_PLAYING) {
        PADDLE.keyUpHandler(e);
      }
    }, false);

    document.addEventListener("mousemove", (e) => {
      if (gameState === STATE_PLAYING) {
        PADDLE.mouseMoveHandler(e);
      }
    }, false);

    draw();
  </script>
</body>

</html>
