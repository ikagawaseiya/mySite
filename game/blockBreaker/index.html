<!doctype html>
<!--mdn ブロック崩し STEP2 各フレームの前にキャンバスを消去まで-->
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ブロック崩しゲーム</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    canvas {
      background: #eee;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <canvas id="myCanvas" width="480" height="320"></canvas>
  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    //ボールの各種設定
    const ballRadius = 10;
    let x = canvas.width / 2;
    let y = canvas.height / 2;
    startDxSpeed = 2;
    startDySpeed = 2;
    let dx = startDxSpeed;
    let dy = startDySpeed;
    const startBallColorNumber = 240;
    let ballColorStyle = `hsl(${startBallColorNumber}, 70%, 60%)`;
    //パドルの描画設定
    const paddleHeight = 10;
    const paddleWidth = 75;
    let paddleX = (canvas.width - paddleWidth) / 2;
    //パドルの操作設定
    let rightPressed = false;
    let leftPressed = false;
    //ブロックの描画設定
    const brickRowCount = 3;
    const brickColumnCount = 5;
    const brickWidth = 75;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 30;
    //スコアの描画設定
    let score = 0;

    const bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
      bricks[c] = [];
      for (let r = 0; r < brickRowCount; r++) {
        //値x,y,破壊の判定statusのプロパティ
        bricks[c][r] = { x: 0, y: 0, status: 1 };
      }
    }


    /*
    *ブロックを並べて配置する
    *statusが1ではない(破壊された)ものは表示しない
    */
    function drawBricks() {
      for (var c = 0; c < brickColumnCount; c++) {
        for (var r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status == 1) {
            var brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
            var brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.beginPath();
            ctx.rect(brickX, brickY, brickWidth, brickHeight);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    //ボールの描画
    function drawBall() {
      ctx.beginPath();
      ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = ballColorStyle;
      ctx.fill();
      ctx.closePath();
    }

    //パドルの描画
    function drawPaddle() {
      ctx.beginPath();
      ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
      ctx.fillStyle = "#0095DD";
      ctx.fill();
      ctx.closePath();
    }

    /*ボールの色を、ランダムに変更する*/
    function changeBallColorRandom() {
      let randomColor = Math.floor(Math.random() * 360);
      ballColorStyle = `hsl(${randomColor}, 70%, 60%)`;
    }

    /*
    *ブロックの衝突判定
    *[c][r]それぞれののfor文によりブロックを特定
    *ボールの判定xyが重なった場合に衝突とする
    */
    function collisionDetection() {
      for (var c = 0; c < brickColumnCount; c++) {
        for (var r = 0; r < brickRowCount; r++) {
          var b = bricks[c][r];
          //衝突した場合の処理
          if (b.status == 1) {
            if (x > b.x &&
              x < b.x + brickWidth &&
              y > b.y &&
              y < b.y + brickHeight) {
              dy = -dy;
              b.status = 0;
              changeBallColorRandom()
              score++;
              if (score === brickRowCount * brickColumnCount) {
                alert("YOU WIN, CONGRATULATIONS!");
                document.location.reload();
                clearInterval(interval);
              }
            }
          }
        }
      }
    }

    //スコアの描画
    function drawScore() {
      ctx.font = "16px Arial";
      ctx.fillStyle = "#0095DD";
      ctx.fillText(`Score: ${score}`, 8, 20);
    }

    /*
    *パドル反射時に変更されるボール速度
    *TODO　現状では貫通するバグが発生するので使用不可
    */
    function changeSpeedForPaddleReflection() {
      ballMaxSpeedLimit = 3;
      if (dx < 0 && dx > -ballMaxSpeed) {
        dx = dx - 1;
      } else if (dx < ballMaxSpeedLimit) {
        dx = dx + 1;
      }
      if (dy < -ballMaxSpeedLimit) {
        dy - 1;
      }
    }

    //全体の動きを管理する
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawBall();
      drawPaddle();
      drawScore();
      collisionDetection();
      x += dx;
      y += dy;

      if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
        dx = -dx;
        changeBallColorRandom();
      }

      if (y + dy < ballRadius) {
        dy = -dy;
        changeBallColorRandom();
      } else if (y + dy > canvas.height - ballRadius) {
        //パドルで反射した場合
        if (x > paddleX && x < paddleX + paddleWidth) {
          dy = -dy;
          changeBallColorRandom();
        } else {
          alert("GAME OVER");
          document.location.reload();
          clearInterval(interval);
        }
      }

      //パドルの移動設定
      if (rightPressed) {
        paddleX = Math.min(paddleX + 7, canvas.width - paddleWidth);
      } else if (leftPressed) {
        paddleX = Math.max(paddleX - 7, 0);
      }
    }

    document.addEventListener("keydown", keyDownHandler, false);
    document.addEventListener("keyup", keyUpHandler, false);

    /*キーボード入力を検知する*/
    function keyDownHandler(e) {
      if (e.key === "Right" || e.key === "ArrowRight") {
        rightPressed = true;
      } else if (e.key === "Left" || e.key === "ArrowLeft") {
        leftPressed = true;
      }
    }

    function keyUpHandler(e) {
      if (e.key === "Right" || e.key === "ArrowRight") {
        rightPressed = false;
      } else if (e.key === "Left" || e.key === "ArrowLeft") {
        leftPressed = false;
      }
    }


    //これによりコンマ10秒ごとに動作
    const interval = setInterval(draw, 10);
  </script>
</body>

</html>
